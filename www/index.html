<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Husen Mudi Dokan</title>
<style>
body{font-family:sans-serif;background:#f0f5f0;margin:0;padding:15px}
header{background:#087f3e;color:white;padding:20px;text-align:center;border-radius:12px}
.box{background:white;padding:15px;margin-top:15px;border-radius:12px}
input,button{box-sizing:border-box;width:100%;padding:12px;margin:5px 0;border-radius:7px}
input{border:1px solid #ccc}
button{background:#087f3e;color:white;border:0;font-size:16px}
.item{padding:12px;border-bottom:1px solid #ddd}
.delete{background:#c62828}
#status{font-size:14px;color:#555}
</style>
</head>
<body>
<header>
<h2>🛒 Husen Mudi Dokan</h2>
<p>আপনার বিশ্বস্ত মুদি দোকান</p>
</header>

<div class="box" id="loginBox">
<h3>🔐 মালিকের লগইন</h3>
<input id="email" type="email" placeholder="আপনার ইমেইল">
<input id="password" type="password" placeholder="পাসওয়ার্ড">
<button id="loginBtn">লগইন</button>
<button id="resetBtn" type="button">পাসওয়ার্ড ভুলে গেছেন?</button>
<button id="logoutBtn" hidden>লগআউট</button>
<p id="loginStatus">পণ্যের দাম দেখতে লগইন লাগবে না।</p>
</div>
<div class="box" id="adminBox" hidden>
<h3>➕ নতুন পণ্য যোগ করুন</h3>
<input id="name" placeholder="পণ্যের নাম">
<input id="price" type="number" min="0.01" step="any" placeholder="দাম (টাকা)">
<input id="qty" type="number" min="0.01" step="any" placeholder="পরিমাণ">
<button id="addBtn">পণ্য যোগ করুন</button>
<p id="status">অনলাইন ডেটাবেসের সঙ্গে সংযোগের অপেক্ষায়...</p>
</div>

<div class="box">
<h3>📦 পণ্যের তালিকা</h3>
<div id="products">লোড হচ্ছে...</div>
</div>

<script type="module">
import {initializeApp} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import {getAuth, onAuthStateChanged, signInWithEmailAndPassword, sendPasswordResetEmail, signOut} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import {
 getFirestore,collection,addDoc,deleteDoc,doc,onSnapshot,
 updateDoc
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const firebaseConfig = {
 apiKey: "AIzaSyAIVxIMJ5nXeWhfxREZkX5Xh99PHIJqiu0",
 authDomain: "husen-mudi-dokan.firebaseapp.com",
 projectId: "husen-mudi-dokan",
 storageBucket: "husen-mudi-dokan.firebasestorage.app",
 messagingSenderId: "650858368725",
 appId: "1:650858368725:web:f08dbc18b2f3a175455c5c"
};

const app=initializeApp(firebaseConfig);
const db=getFirestore(app);
const auth=getAuth(app);
let isOwner=false;
const productsRef=collection(db,"products");
const list=document.getElementById("products");
const status=document.getElementById("status");
const adminBox=document.getElementById("adminBox");
const loginStatus=document.getElementById("loginStatus");
document.getElementById("loginBtn").addEventListener("click",async()=>{
 const email=document.getElementById("email").value.trim();
 const password=document.getElementById("password").value;
 if(!email||!password){loginStatus.textContent="ইমেইল ও পাসওয়ার্ড লিখুন।";return;}
 try{
  await signInWithEmailAndPassword(auth,email,password);
  loginStatus.textContent="লগইন সফল।";
 }catch(e){
  console.error(e);
  loginStatus.textContent="লগইন হয়নি। ইমেইল ও পাসওয়ার্ড পরীক্ষা করুন।";
 }
});
document.getElementById("resetBtn").addEventListener("click",async()=>{
 const email=document.getElementById("email").value.trim();
 if(!email){
  loginStatus.textContent="আগে আপনার ইমেইল লিখুন।";
  return;
 }
 try{
  await sendPasswordResetEmail(auth,email);
  loginStatus.textContent="পাসওয়ার্ড রিসেট লিংক ইমেইলে পাঠানো হয়েছে। Inbox ও Spam দেখুন।";
 }catch(e){
  console.error(e);
  loginStatus.textContent="Error: "+e.code+" — "+e.message;
 }
});
document.getElementById("logoutBtn").addEventListener("click",()=>signOut(auth));
onAuthStateChanged(auth,user=>{
 isOwner=!!user && user.uid==="VPu3M9yHj0SrZRwyOy6bTnzThSY2";
 adminBox.hidden=!isOwner;
 document.getElementById("logoutBtn").hidden=!user;
 document.getElementById("loginBtn").hidden=!!user;
 loginStatus.textContent=isOwner?"মালিক হিসেবে লগইন করা হয়েছে।":user?"এই অ্যাকাউন্টে মালিকের অনুমতি নেই।":"লগইন করা নেই।";
});

function makeButton(label,action,cls=""){
 const b=document.createElement("button");
 b.textContent=label;
 if(cls)b.className=cls;
 b.addEventListener("click",action);
 return b;
}

function renderProducts(items){
 list.replaceChildren();
 if(!items.length){list.textContent="এখনো কোনো পণ্য যোগ করা হয়নি।";return;}
 for(const p of items){
  const box=document.createElement("div");
  box.className="item";
  const title=document.createElement("b");
  title.textContent=p.name;
  const info=document.createElement("p");
  info.textContent=`দাম: ${p.price} টাকা | পরিমাণ: ${p.qty}`;
  box.append(title,info);
  if(isOwner) box.append(makeButton("দাম পরিবর্তন",async()=>{
   const value=prompt("নতুন দাম লিখুন:",p.price);
   if(value===null)return;
   const price=Number(value);
   if(!Number.isFinite(price)||price<=0){alert("সঠিক দাম লিখুন");return;}
   try{await updateDoc(doc(db,"products",p.id),{price});}
   catch(e){alert("দাম পরিবর্তন হয়নি। ডেটাবেসের অনুমতি পরীক্ষা করুন।");}
  }));
  if(isOwner) box.append(makeButton("পণ্য মুছুন",async()=>{
   if(!confirm("পণ্যটি মুছে ফেলবেন?"))return;
   try{await deleteDoc(doc(db,"products",p.id));}
   catch(e){alert("পণ্য মোছা যায়নি। ডেটাবেসের অনুমতি পরীক্ষা করুন।");}
  },"delete"));
  list.append(box);
 }
}

document.getElementById("addBtn").addEventListener("click",async()=>{
 if(!isOwner){alert("আগে মালিক হিসেবে লগইন করুন।");return;}
 const name=document.getElementById("name").value.trim();
 const price=Number(document.getElementById("price").value);
 const qty=Number(document.getElementById("qty").value);
 if(!name||!Number.isFinite(price)||price<=0||!Number.isFinite(qty)||qty<=0){
  alert("পণ্যের নাম, সঠিক দাম ও পরিমাণ লিখুন");return;
 }
 try{
  await addDoc(productsRef,{name,price,qty});
  document.getElementById("name").value="";
  document.getElementById("price").value="";
  document.getElementById("qty").value="";
  status.textContent="পণ্য অনলাইনে সংরক্ষিত হয়েছে।";
 }catch(e){
  status.textContent="সংরক্ষণ হয়নি। Firebase Database-এর নিয়ম পরীক্ষা করতে হবে।";
  console.error(e);
  alert("পণ্য যোগ হয়নি। ডেটাবেসের নিরাপত্তা নিয়ম ঠিক করতে হবে।");
 }
});

onSnapshot(productsRef,snap=>{
 const items=snap.docs.map(d=>({id:d.id,...d.data()}));
 renderProducts(items);
 status.textContent="ডেটাবেসের সঙ্গে সংযুক্ত।";
},e=>{
 console.error(e);
 status.textContent="ডেটাবেস সংযোগ হয়নি। Firebase সেটিংস পরীক্ষা করতে হবে।";
 list.textContent="অনলাইন পণ্য লোড করা যায়নি।";
});
</script>
</body>
</html>
